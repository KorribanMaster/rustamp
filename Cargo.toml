[workspace]
resolver = "3"
members = [
    "crates/metal",
    "crates/virtio",
    "crates/rpmsg",
    "crates/remoteproc",
    "crates/proxy",
]
# Firmware examples build for bare-metal targets and live outside the
# host workspace; the C interop harness is opt-in (needs cmake + a C compiler).
exclude = ["examples/imx8mn-m7-echo", "interop-tests"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "BSD-3-Clause"
repository = "https://github.com/KorribanMaster/rustamp"
authors = ["Eicke Hecht <eicke.hecht@gmail.com>"]
keywords = ["openamp", "rpmsg", "remoteproc", "virtio", "amp"]
categories = ["embedded", "no-std", "hardware-support"]

[workspace.dependencies]
rustamp-metal = { path = "crates/metal", version = "0.1.0", default-features = false }
rustamp-virtio = { path = "crates/virtio", version = "0.1.0", default-features = false }
rustamp-rpmsg = { path = "crates/rpmsg", version = "0.1.0", default-features = false }
rustamp-remoteproc = { path = "crates/remoteproc", version = "0.1.0", default-features = false }
rustamp-proxy = { path = "crates/proxy", version = "0.1.0", default-features = false }
atomic-waker = { version = "1.1", default-features = false }
embedded-io = { version = "0.7", default-features = false }
libc = { version = "0.2", default-features = false }
memmap2 = { version = "0.9", default-features = false }
proptest = "1.11"
pollster = "1.0"
critical-section = { version = "1.2", default-features = false }
defmt = { version = "1.0", default-features = false }
log = { version = "0.4", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
