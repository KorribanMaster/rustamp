name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace --no-default-features

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-features --all-targets
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  embedded:
    name: embedded (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: thumbv7em-none-eabihf
            features: openamp-metal/cortex-m7,openamp-rpmsg/async
          - target: thumbv7m-none-eabi
            features: openamp-rpmsg/async
          - target: armv7a-none-eabi
            features: openamp-metal/armv7a,openamp-rpmsg/async
          - target: aarch64-unknown-none
            features: openamp-rpmsg/async
          - target: riscv32imac-unknown-none-elf
            features: openamp-rpmsg/async
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: >
          cargo build --release --target ${{ matrix.target }} --no-default-features
          -p openamp-metal -p openamp-virtio -p openamp-rpmsg -p openamp-remoteproc -p openamp-proxy
          --features ${{ matrix.features }}

  example-imx8mn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - run: cargo build --release
        working-directory: examples/imx8mn-m7-echo
        env:
          RUSTFLAGS: -D warnings -C link-arg=-Tlink.x
      - name: resource table is where Linux expects it
        run: |
          elf=examples/imx8mn-m7-echo/target/thumbv7em-none-eabihf/release/imx8mn-m7-echo
          readelf -SW "$elf" | grep -E '\.resource_table +PROGBITS +2001f000'
      - uses: actions/upload-artifact@v4
        with:
          name: imx8mn-m7-echo
          path: examples/imx8mn-m7-echo/target/thumbv7em-none-eabihf/release/imx8mn-m7-echo

  interop:
    name: interop with C open-amp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y cmake
      - run: ./interop-tests/fetch-c-sources.sh
      - run: cargo test --release --manifest-path interop-tests/Cargo.toml

  miri:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri test -p openamp-metal -p openamp-virtio --all-features --lib
