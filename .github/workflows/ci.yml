name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace --no-default-features

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-features --all-targets
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  features:
    name: feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - run: >
          cargo hack check --feature-powerset --depth 2
          -p rustamp-metal -p rustamp-virtio -p rustamp-rpmsg -p rustamp-remoteproc -p rustamp-proxy

  deny:
    name: licences, advisories, sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  semver:
    name: semver checks (release PRs)
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          # Not on crates.io yet: compare with the branch being merged into.
          baseline-rev: ${{ github.event.pull_request.base.sha }}

  embedded:
    name: embedded (${{ matrix.target }}, ${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: thumbv7em-none-eabihf
            features: rustamp-metal/cortex-m7,rustamp-rpmsg/async
          - target: thumbv7em-none-eabihf
            features: rustamp-metal/critical-section,rustamp-rpmsg/defmt,rustamp-proxy/embedded-io
          - target: thumbv7m-none-eabi
            features: rustamp-rpmsg/async
          - target: armv7a-none-eabi
            features: rustamp-metal/armv7a,rustamp-rpmsg/async
          - target: aarch64-unknown-none
            features: rustamp-rpmsg/async
          - target: riscv32imac-unknown-none-elf
            features: rustamp-rpmsg/async
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: >
          cargo build --release --target ${{ matrix.target }} --no-default-features
          -p rustamp-metal -p rustamp-virtio -p rustamp-rpmsg -p rustamp-remoteproc -p rustamp-proxy
          --features ${{ matrix.features }}

  example-imx8mn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - run: cargo build --release
        working-directory: examples/imx8mn-m7-echo
        env:
          RUSTFLAGS: -D warnings -C link-arg=-Tlink.x
      - name: vector table and resource table are where they belong
        run: |
          elf=examples/imx8mn-m7-echo/target/thumbv7em-none-eabihf/release/imx8mn-m7-echo
          readelf -SW "$elf" | grep -E '\.vector_table +PROGBITS +00000000'
          readelf -SW "$elf" | grep -E '\.resource_table +PROGBITS +2001f000'
          # The reset code zeroes .bss; the table Linux writes must be past it.
          ebss=$(nm "$elf" | awk '$3 == "__ebss" { print $1 }')
          test $((0x$ebss)) -le $((0x2001f000))
      - uses: actions/upload-artifact@v6
        with:
          name: imx8mn-m7-echo
          path: examples/imx8mn-m7-echo/target/thumbv7em-none-eabihf/release/imx8mn-m7-echo
      - name: QEMU variant
        run: cargo build --release --features qemu-imx8mp
        working-directory: examples/imx8mn-m7-echo
        env:
          RUSTFLAGS: -D warnings -C link-arg=-Tlink.x
      - name: QEMU variant layout (DDR)
        run: |
          elf=examples/imx8mn-m7-echo/target/thumbv7em-none-eabihf/release/imx8mn-m7-echo
          readelf -SW "$elf" | grep -E '\.vector_table +PROGBITS +80000000'
          readelf -SW "$elf" | grep -E '\.resource_table +PROGBITS +80f00000'
          ebss=$(nm "$elf" | awk '$3 == "__ebss" { print $1 }')
          test $((0x$ebss)) -le $((0x80f00000))

  example-cortex-a9:
    name: example-cortex-a9 (${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - board: zynq7000
            flags: ""
          - board: arria10
            flags: --no-default-features --features arria10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7a-none-eabi
          components: clippy
      - name: host tests (memory map, MMU table, GIC encodings)
        run: cargo test --lib --target x86_64-unknown-linux-gnu
        working-directory: examples/cortex-a9-rtu-echo
      - run: cargo clippy --release ${{ matrix.flags }} -- -D warnings
        working-directory: examples/cortex-a9-rtu-echo
      - run: cargo build --release ${{ matrix.flags }}
        working-directory: examples/cortex-a9-rtu-echo
        env:
          RUSTFLAGS: -D warnings -C link-arg=-Trtu.x
      - name: entry and resource table are where Linux expects them
        run: |
          elf=examples/cortex-a9-rtu-echo/target/armv7a-none-eabi/release/cortex-a9-rtu-echo
          readelf -hW "$elf" | grep -E 'Entry point address: +0x3e000000'
          readelf -SW "$elf" | grep -E '\.resource_table +PROGBITS +3ef00000'
          mv "$elf" "$elf-${{ matrix.board }}"
      - uses: actions/upload-artifact@v6
        with:
          name: cortex-a9-rtu-echo-${{ matrix.board }}
          path: examples/cortex-a9-rtu-echo/target/armv7a-none-eabi/release/cortex-a9-rtu-echo-${{ matrix.board }}

  example-zynqmp:
    name: example-zynqmp (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: zcu102
            flags: ""
          - variant: qemu
            flags: --features qemu
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7r-none-eabihf
          components: clippy
      - name: host tests (memory map, IPI and GIC encodings)
        run: cargo test --lib --target x86_64-unknown-linux-gnu
        working-directory: examples/zynqmp-r5-echo
      - run: cargo clippy --release ${{ matrix.flags }} -- -D warnings
        working-directory: examples/zynqmp-r5-echo
      - run: cargo build --release ${{ matrix.flags }}
        working-directory: examples/zynqmp-r5-echo
        env:
          RUSTFLAGS: -D warnings -C link-arg=-Tlink.x
      - name: vectors, resource table and trace buffer are where Linux expects them
        run: |
          elf=examples/zynqmp-r5-echo/target/armv7r-none-eabihf/release/zynqmp-r5-echo
          readelf -SW "$elf" | grep -E '\.vector_table +PROGBITS +00000000'
          readelf -SW "$elf" | grep -E '\.resource_table +PROGBITS +3ed00000'
          readelf -SW "$elf" | grep -E '\.rsc_trace +NOBITS +3ed01000'
          # The reset code zeroes .bss; the stacks and .bss stay in BTCM.
          ebss=$(nm "$elf" | awk '$3 == "__ebss" { print $1 }')
          test $((0x$ebss)) -le $((0x30000))
          mv "$elf" "$elf-${{ matrix.variant }}"
      - uses: actions/upload-artifact@v6
        with:
          name: zynqmp-r5-echo-${{ matrix.variant }}
          path: examples/zynqmp-r5-echo/target/armv7r-none-eabihf/release/zynqmp-r5-echo-${{ matrix.variant }}

  interop:
    name: interop with C open-amp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y cmake
      - run: ./interop-tests/fetch-c-sources.sh
      - run: cargo test --release --manifest-path interop-tests/Cargo.toml

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # Isolation is off because the proxy tests use a temporary directory.
      - run: cargo miri test --workspace --all-features
        env:
          MIRIFLAGS: -Zmiri-disable-isolation

  loom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            target
          key: loom-${{ hashFiles('Cargo.lock') }}
      - run: cargo test -p rustamp-metal --test loom --release
        env:
          RUSTFLAGS: --cfg loom
