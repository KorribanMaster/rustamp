name: Release

# Publishes the library crates to crates.io and creates a GitHub release.
#
# * Push a tag `vX.Y.Z` matching the workspace version to release.
# * Run it by hand ("Run workflow") for a dry run; a real publish from a
#   manual run needs a tag ref and `dry-run` unticked (to finish a release
#   that failed halfway: crates already on crates.io are skipped).
#
# Authentication: crates.io trusted publishing (configure this repository
# and workflow, `release.yml`, environment `crates-io`, for each crate on
# crates.io). A brand-new crate cannot use trusted publishing, so the first
# release needs a `CARGO_REGISTRY_TOKEN` secret in the `crates-io`
# environment; remove it afterwards.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Package and verify only, upload nothing
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Dependency order.
  CRATES: openamp-metal openamp-virtio openamp-rpmsg openamp-remoteproc openamp-proxy

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: thumbv7em-none-eabihf
      - name: workspace version (must match the tag)
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "openamp-metal") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match workspace version $version"
            exit 1
          fi
      - run: cargo test --workspace --all-features
      - run: cargo clippy --workspace --all-features --all-targets
      - run: >
          cargo build --release --target thumbv7em-none-eabihf --no-default-features
          -p openamp-metal -p openamp-virtio -p openamp-rpmsg -p openamp-remoteproc -p openamp-proxy
      - name: docs as docs.rs builds them
        uses: dtolnay/rust-toolchain@nightly
      - run: cargo +nightly doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
      # Packages every crate and builds it from the package, against the
      # others as packaged, in dependency order.
      - run: cargo +stable publish --workspace --dry-run

  publish:
    needs: verify
    if: >
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' || !inputs.dry-run)
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write # the GitHub release
      id-token: write # crates.io trusted publishing
    env:
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        if: env.HAS_TOKEN != 'true'
        id: auth
      - name: publish (skipping versions already on crates.io)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          for c in $CRATES; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -A "$GITHUB_REPOSITORY release" \
              "https://crates.io/api/v1/crates/$c/$VERSION")
            if [ "$status" = 200 ]; then
              echo "$c $VERSION is already on crates.io, skipping"
              continue
            fi
            # Waits until the crate is in the index before the next one.
            cargo publish -p "$c"
          done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
              --title "openamp-rs $GITHUB_REF_NAME"
