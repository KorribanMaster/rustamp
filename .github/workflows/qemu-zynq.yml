name: QEMU xilinx-zynq-a9 (Cortex-A9 Linux + RTU)

# Builds upstream QEMU, a mainline kernel with linux/a9-rproc built in and
# the Cortex-A9 RTU firmware, then runs the Linux <-> CPU1 rpmsg echo test
# with two stop/start reloads. Also compiles the driver as an out-of-tree
# module and the Arria 10 device tree. Heavy, so nightly and on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: "47 2 * * *"

jobs:
  qemu-zynq:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7a-none-eabi
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libglib2.0-dev \
            libpixman-1-dev python3-venv clang lld llvm flex bison bc \
            device-tree-compiler
      - uses: actions/cache@v5
        with:
          path: |
            qemu-work/qemu-build
            qemu-work/linux
            qemu-work/linux-build
          key: qemu-zynq-${{ hashFiles('examples/cortex-a9-rtu-echo/qemu/reproduce.sh') }}
      - run: examples/cortex-a9-rtu-echo/qemu/reproduce.sh "$PWD/qemu-work"
      - name: out-of-tree module build
        run: |
          w=$PWD/qemu-work
          make -s -C "$w/linux" ARCH=arm LLVM=1 O="$w/linux-mod" multi_v7_defconfig
          "$w/linux/scripts/config" --file "$w/linux-mod/.config" -e REMOTEPROC -e RPMSG_VIRTIO
          make -s -C "$w/linux" ARCH=arm LLVM=1 O="$w/linux-mod" olddefconfig
          make -s -C "$w/linux" ARCH=arm LLVM=1 O="$w/linux-mod" -j"$(nproc)" modules_prepare
          # No vmlinux, so modpost cannot resolve symbols; compile warnings fail.
          make -C linux/a9-rproc KDIR="$w/linux-mod" ARCH=arm LLVM=1 \
            KBUILD_MODPOST_WARN=1 W=1 KCFLAGS=-Werror
          ls -l linux/a9-rproc/a9_rproc.ko
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: qemu-zynq-logs
          path: |
            qemu-work/console.log
            qemu-work/rtu-uart0.log
