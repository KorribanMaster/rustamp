[package]
name = "rustamp-interop-tests"
description = "Wire-compatibility tests between RustAmp and the C libmetal/open-amp libraries"
version = "0.0.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false
build = "build.rs"

# Not part of the main workspace: building needs cmake, a C compiler and the
# C sources (./fetch-c-sources.sh). Run with
#   cargo test --manifest-path interop-tests/Cargo.toml
[workspace]

[dependencies]
rustamp-metal = { path = "../crates/metal", features = ["std"] }
rustamp-virtio = { path = "../crates/virtio" }
rustamp-rpmsg = { path = "../crates/rpmsg" }
rustamp-remoteproc = { path = "../crates/remoteproc" }

[build-dependencies]
cc = "1.2"
cmake = "0.1"
