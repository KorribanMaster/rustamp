[package]
name = "imx8mn-m7-echo"
description = "rpmsg echo firmware for the Cortex-M7 of an i.MX 8M Nano, driven by Linux remoteproc"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false

# Standalone: builds for thumbv7em-none-eabihf, outside the host workspace.
[workspace]

[dependencies]
openamp-metal = { path = "../../crates/metal", features = ["cortex-m7", "critical-section"] }
openamp-virtio = { path = "../../crates/virtio", default-features = false }
openamp-rpmsg = { path = "../../crates/rpmsg" }
openamp-remoteproc = { path = "../../crates/remoteproc" }
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
# Without the `device` feature: all 240 interrupt vectors go to
# `DefaultHandler(irqn)`, which dispatches the MU interrupt.
cortex-m-rt = "0.7.5"
panic-halt = "1.0"

[features]
# QEMU imx8mp-evk with the Cortex-M7 AMP series: the M7 shares the A53
# physical map and boots from 0x80000000 (DDR), and the MU's B side has no
# interrupt to the M7, so this variant links into DDR, polls the MU and logs
# to UART4.
# Linked into DDR, so VTOR must point at our vector table (real silicon
# resets with VTOR = 0).
qemu-imx8mp = ["cortex-m-rt/set-vtor"]

[[bin]]
name = "imx8mn-m7-echo"
test = false
bench = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
debug = true
codegen-units = 1

