# cargo-deny configuration: `cargo deny check`.

[graph]
all-features = true

[licenses]
# Licences of the crates themselves and of their dependencies, including
# build- and dev-dependencies.
allow = [
    "BSD-3-Clause",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
]
confidence-threshold = 0.9
# The list is the policy, not an inventory of what is in use today.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies within the workspace carry no version requirement.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "deny"
