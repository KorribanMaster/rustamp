[package]
name = "rustamp-virtio"
description = "Virtio split virtqueues (driver and device roles) and transports for OpenAMP in Rust"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["mmio"]
# virtio-mmio transport (driver side).
mmio = []
# Diagnostics through the `log` or `defmt` facade. Without either, nothing is
# logged.
log = ["rustamp-metal/log"]
defmt = ["dep:defmt", "rustamp-metal/defmt"]

[dependencies]
rustamp-metal.workspace = true
defmt = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
rustamp-metal = { workspace = true, features = ["std"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
