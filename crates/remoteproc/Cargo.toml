[package]
name = "rustamp-remoteproc"
description = "Remote processor lifecycle, ELF loading, resource tables and virtio transport for OpenAMP in Rust"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# `ImageStore` for files.
std = ["rustamp-metal/std"]
# Diagnostics through the `log` or `defmt` facade. Without either, nothing is
# logged.
log = ["dep:log", "rustamp-metal/log", "rustamp-virtio/log"]
defmt = ["dep:defmt", "rustamp-metal/defmt", "rustamp-virtio/defmt"]

[dependencies]
rustamp-metal.workspace = true
rustamp-virtio.workspace = true
log = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
rustamp-metal = { workspace = true, features = ["std"] }
rustamp-rpmsg.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
