[package]
name = "openamp-metal"
description = "Hardware and OS abstraction layer for OpenAMP in Rust (a port of libmetal)"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Heap-backed helpers (IoRegion::alloc) for host-side simulation and tests.
alloc = []
# std helpers (thread-sleeping delay, std error impls).
std = ["alloc"]
# Linux userspace backend: UIO devices and shared-memory files via mmap.
linux = ["std", "dep:memmap2", "dep:libc"]
# Cache maintenance for the core this crate is compiled for.
cortex-m7 = []
armv7a = []
# `sync::CsLock`: a lock that masks interrupts, for rpmsg used from interrupt
# handlers. The application links a `critical-section` implementation.
critical-section = ["dep:critical-section"]
# Diagnostics through the `log` or `defmt` facade. Without either, nothing is
# logged.
# (openamp-metal itself does not log; `log` exists so features forward uniformly.)
log = []
defmt = ["dep:defmt"]

[dependencies]
critical-section = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
memmap2 = { workspace = true, optional = true }

# Model checking of the lock-free code: RUSTFLAGS="--cfg loom".
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[dev-dependencies]
critical-section = { workspace = true, features = ["std"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
