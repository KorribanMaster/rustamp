[package]
name = "rustamp-proxy"
description = "File and console I/O forwarding over rpmsg (rpmsg_retarget), remote client and host server"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["rpmsg"]
# `Channel` implementation over an rustamp-rpmsg endpoint.
rpmsg = ["dep:rustamp-rpmsg", "dep:rustamp-virtio", "dep:rustamp-metal"]
# Host-side server executing requests against the host filesystem.
std = []
# `ProxyClient::open_file`, returning a `ProxyFile` that implements
# `embedded_io::{Read, Write}`.
embedded-io = ["dep:embedded-io"]
# Diagnostics through the `log` or `defmt` facade. Without either, nothing is
# logged.
log = ["rustamp-rpmsg?/log", "rustamp-virtio?/log", "rustamp-metal?/log"]
defmt = [
    "dep:defmt",
    "rustamp-rpmsg?/defmt",
    "rustamp-virtio?/defmt",
    "rustamp-metal?/defmt",
]

[dependencies]
rustamp-rpmsg = { workspace = true, optional = true }
rustamp-virtio = { workspace = true, optional = true }
rustamp-metal = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }
embedded-io = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
rustamp-metal = { workspace = true, features = ["std"] }
rustamp-virtio.workspace = true
rustamp-rpmsg.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
